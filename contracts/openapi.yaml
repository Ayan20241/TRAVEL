components:
  schemas:
    ActivityIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 2
          title: Name
        city:
          type: string
          maxLength: 120
          minLength: 2
          title: City
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        duration_minutes:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Duration Minutes
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Price
        currency:
          type: string
          title: Currency
          default: INR
        vendor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendor Id
      type: object
      required:
      - name
      - city
      title: ActivityIn
    ActivityOut:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 2
          title: Name
        city:
          type: string
          maxLength: 120
          minLength: 2
          title: City
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        duration_minutes:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Duration Minutes
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Price
        currency:
          type: string
          title: Currency
          default: INR
        vendor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendor Id
        id:
          type: string
          format: uuid
          title: Id
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - name
      - city
      - id
      - is_active
      title: ActivityOut
    AuditOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        action:
          type: string
          title: Action
        resource_type:
          type: string
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        old_state:
          type: object
          title: Old State
        new_state:
          type: object
          title: New State
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - action
      - resource_type
      - old_state
      - new_state
      - created_at
      title: AuditOut
    BookingCreate:
      properties:
        service_type:
          type: string
          maxLength: 60
          minLength: 2
          title: Service Type
        service_name:
          type: string
          maxLength: 250
          minLength: 2
          title: Service Name
        vendor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendor Id
        amount:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Amount
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          default: INR
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - service_type
      - service_name
      title: BookingCreate
    BookingOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        trip_id:
          type: string
          format: uuid
          title: Trip Id
        traveler_id:
          type: string
          format: uuid
          title: Traveler Id
        vendor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vendor Id
        service_type:
          type: string
          title: Service Type
        service_name:
          type: string
          title: Service Name
        reference_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Code
        status:
          $ref: '#/components/schemas/BookingStatus'
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
        currency:
          type: string
          title: Currency
        booked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Booked At
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - id
      - trip_id
      - traveler_id
      - service_type
      - service_name
      - status
      - currency
      title: BookingOut
    BookingStatus:
      type: string
      enum:
      - PLANNED
      - PENDING
      - CONFIRMED
      - CANCELLED
      - REBOOKED
      - COMPLETED
      title: BookingStatus
    BookingUpdate:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/BookingStatus'
          - type: 'null'
        amount:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Amount
        reference_code:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Reference Code
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      title: BookingUpdate
    DependencyCreate:
      properties:
        source_item_id:
          type: string
          format: uuid
          title: Source Item Id
        target_item_id:
          type: string
          format: uuid
          title: Target Item Id
        dependency_type:
          type: string
          pattern: ^(SEQUENTIAL|SPATIAL)$
          title: Dependency Type
          default: SEQUENTIAL
        minimum_required_buffer_minutes:
          type: integer
          maximum: 1440.0
          minimum: 0.0
          title: Minimum Required Buffer Minutes
          default: 30
      type: object
      required:
      - source_item_id
      - target_item_id
      title: DependencyCreate
    DependencyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        trip_id:
          type: string
          format: uuid
          title: Trip Id
        source_item_id:
          type: string
          format: uuid
          title: Source Item Id
        target_item_id:
          type: string
          format: uuid
          title: Target Item Id
        dependency_type:
          type: string
          title: Dependency Type
        minimum_required_buffer_minutes:
          type: integer
          title: Minimum Required Buffer Minutes
      type: object
      required:
      - id
      - trip_id
      - source_item_id
      - target_item_id
      - dependency_type
      - minimum_required_buffer_minutes
      title: DependencyOut
    DestinationOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        country:
          type: string
          title: Country
        description:
          anyOf:
          - type: string
          - type: 'null'
